<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (function () {
        var s = localStorage.getItem("tokenmaxxx:theme");
        var t =
          s === "light" || s === "dark"
            ? s
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <title>tokenmaxxx — see what your AI coding tools cost</title>
    <meta
      name="description"
      content="Read the usage files from Claude Code, OpenCode, and Codex CLI, then break down tokens and estimated cost by day, model, project, and session."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./landing.tsx"></script>
  </body>
</html>
